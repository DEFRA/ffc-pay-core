services:
  ffc-pay-local-recovery-postgres:
    image: postgres:11.4-alpine
    environment:
      POSTGRES_DB: ffc_pay_local_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ppp
    ports:
      - "5467:5432"
    volumes:
      - ffc-pay-local-recovery-data:/var/lib/postgresql/data

volumes:
  ffc-pay-local-recovery-data: